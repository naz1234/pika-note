<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3e8" />
    <title>Pika Note — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:#f7f3e8;color:#24231f;font:16px/1.55 ui-rounded,"SF Pro Rounded","Segoe UI",sans-serif}.card{max-width:420px;padding:34px;border:1px solid #d9d2c1;border-radius:26px;background:#fffdf7;box-shadow:8px 8px 0 #e6ddc8}.mark{width:58px;height:58px;display:grid;place-items:center;margin-bottom:24px;border-radius:17px;background:#f4c84a;font-size:27px;font-weight:900}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b675e}h1{margin:8px 0 10px;font-size:30px;line-height:1.1}p{margin:0;color:#625f57}button{margin-top:24px;min-height:48px;padding:0 20px;border:1px solid #24231f;border-radius:999px;background:#24231f;color:#fff;font:inherit;font-weight:750;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark" aria-hidden="true">✦</div><div class="eyebrow">Pika Note</div><h1>You’re offline.</h1><p>Your notebook will be ready again as soon as this device reconnects.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
